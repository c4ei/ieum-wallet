name: Sync latest IEUM Chain into Normal wallet

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sync-latest-ieum-chain
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare latest Core with the published Normal wallet
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core_ref="$(
            git ls-remote --tags --refs https://github.com/c4ei/ieum-chain.git 'refs/tags/v*' \
              | sed -n 's#.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
              | sort -V \
              | tail -n 1
          )"
          if [ -z "$core_ref" ]; then
            echo "No stable IEUM Chain tag matching vMAJOR.MINOR.PATCH was found" >&2
            exit 1
          fi

          release_body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/wallet-normal-latest" --jq .body 2>/dev/null || true)"
          if grep -Fqx "IEUM Chain: $core_ref" <<< "$release_body"; then
            echo "Normal wallet already contains $core_ref"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Normal wallet needs $core_ref"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "core_ref=$core_ref" >> "$GITHUB_OUTPUT"
      - name: Resolve wallet display version
        if: steps.compare.outputs.needs_build == 'true'
        id: wallet-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version.replace('-', '.')")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Start signed Normal wallet release
        if: steps.compare.outputs.needs_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_REF: ${{ steps.compare.outputs.core_ref }}
          WALLET_VERSION: ${{ steps.wallet-version.outputs.version }}
        run: |
          gh workflow run wallet-build.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f version="$WALLET_VERSION" \
            -f core_ref="$CORE_REF" \
            -f normal_only=true \
            -f android_release=false
